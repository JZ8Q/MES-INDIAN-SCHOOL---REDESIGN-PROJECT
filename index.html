<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M.E.S INDIAN SCHOOL</title>
<link rel="shortcut icon" href="assets/anniversary-logo.png" type="image/x-icon">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Montserrat:wght@400;500;600;700&display=swap');

:root {
  --navy: #02091b;
  --gold: #f8c744;
  --maroon: #520018;
}
* { box-sizing: border-box; }
html, body { width:100%; height:100%; margin:0; }
body { overflow:hidden; background:var(--navy); color:#fff; }
.loader {
  position:relative; width:100%; height:100svh; min-height:420px;
  overflow:hidden; isolation:isolate;
  background:
    radial-gradient(ellipse at 75% 42%, rgba(32,42,66,.48), transparent 48%),
    linear-gradient(110deg, #020817 0%, #030b1e 55%, #071027 100%);
}
.building {
  position:absolute; right:0%; top:0%; width:39%; height:100%;
  background:url("assets/school-building.jpg") center/cover no-repeat;
  opacity:.47; filter:grayscale(1) brightness(.55) contrast(1.08);
  -webkit-mask-image:linear-gradient(to left, #000 45%, transparent 100%);
  mask-image:linear-gradient(to left, #000 45%, transparent 100%);
}
.shade {
  position:absolute; inset:0; z-index:1;
  background:linear-gradient(90deg, rgba(2,8,23,.96) 0%, rgba(2,8,23,.72) 49%, rgba(2,8,23,.18) 100%),
             linear-gradient(0deg, rgba(2,8,23,.78), transparent 38%);
}
.curves { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }
.watermark {
  position:absolute; z-index:3; left:2.4%; top:23%;
  color:rgba(198,157,94,.075); font-family:Georgia,serif;
  font-size:clamp(170px, 25vw, 390px); line-height:.8;
  font-weight:400; letter-spacing:-.09em;
}
.watermark-script {
  position:absolute; z-index:3; left:6.2%; top:56%;
  color:rgba(190,145,93,.20); font:clamp(30px,4.6vw,66px) "Great Vibes",cursive;
  white-space:nowrap; transform:rotate(-3deg);
}
.center {
  position:absolute; z-index:4; left:50%; top:49%;
  transform:translate(-50%,-50%); width:min(620px, 58vw);
  display:flex; flex-direction:column; align-items:center; text-align:center;
}
.emblem {
  width:clamp(190px, 20vw, 315px); height:auto; display:block;
  object-fit:contain; mix-blend-mode:screen;
  filter:drop-shadow(0 0 13px rgba(255,183,25,.32));
  margin-bottom:8px;
}
.school-name {
  font:600 clamp(25px,2.8vw,43px)/1.05 "Cormorant Garamond", Georgia,serif;
  letter-spacing:.005em; white-space:nowrap;
  text-shadow:0 2px 10px rgba(0,0,0,.35);
}
.motto {
  margin-top:12px; width:100%; display:flex; align-items:center; gap:14px;
  color:#f8c744; font:600 clamp(11px,1.35vw,19px) Montserrat,sans-serif;
  letter-spacing:.48em; white-space:nowrap; justify-content:center;
}
.motto:before,.motto:after {
  content:""; height:2px; flex:1; max-width:102px;
  background:linear-gradient(90deg,transparent,#e8a928);
}
.motto:after { transform:scaleX(-1); }
.loading {
  position:absolute; z-index:5; left:50%; bottom:19.4%;
  transform:translateX(-50%); width:min(410px,35vw); text-align:center;
  font:500 19px Montserrat,sans-serif; color:#f4f3f5;
}
.track {
  width:100%; height:5px; border-radius:10px; overflow:hidden;
  background:rgba(175,181,198,.20); margin-bottom:18px;
}
.progress {
  height:100%;
  width:0%;
  border-radius:10px;
  background:linear-gradient(90deg,#e9a92b,#ffe16a);
  box-shadow:0 0 12px 2px rgba(255,190,48,.7);
}
@keyframes load { from{width:12%} to{width:88%} }

@media (max-width: 700px) {

  .loader {
    width: 100%;
    height: 100svh;
    min-height: 500px;
  }

  /* Background building */
  .building {
    width: 30%;
    height: 100%;
    top: 0%;
    right: 0%;
    opacity: .23;
    background-position: center;
  }

  /* Decorative anniversary watermark */
  .watermark {
    top: 10%;
    left: 8%;
    font-size: 46vw;
    line-height: .8;
  }

  .watermark-script {
    top: 20%;
    left: 42%;
    transform: translateX(-50%) rotate(-3deg);
    font-size: clamp(27px, 8vw, 34px);
    white-space: nowrap;
  }

  /* Main logo and school information */
  .center {
    width: calc(100% - 36px);
    max-width: 430px;
    left: 50%;
    top: 45%;
    transform: translate(-50%, -50%);
  }

  .emblem {
    width: clamp(150px, 42vw, 190px);
    height: auto;
    margin-bottom: 10px;
  }

  .school-name {
    font-size: clamp(20px, 5.6vw, 26px);
    letter-spacing: 0;
    white-space: nowrap;
  }

  /* Tagline */
  .motto {
    width: 100%;
    margin-top: 12px;
    font-size: clamp(8px, 2.5vw, 10px);
    letter-spacing: .19em;
    gap: 6px;
    white-space: nowrap;
  }

  .motto:before,
  .motto:after {
    max-width: 32px;
    min-width: 12px;
  }

  /* Loading bar */
  .loading {
    width: min(72vw, 280px);
    left: 50%;
    bottom: 16%;
    transform: translateX(-50%);
    font-size: 13px;
  }

  .track {
    height: 5px;
    margin-bottom: 15px;
  }

}
</style>
</head>
<body>
<main class="loader">
  <div class="building"></div>
  <div class="shade"></div>

  <div class="watermark">50</div>
  <div class="watermark-script">Years of Excellence</div>

  <!-- Decorative maroon and gold corner ribbons are SVG, not a background screenshot. -->
  <svg class="curves" viewBox="0 0 1672 941" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffe77a"/>
        <stop offset=".48" stop-color="#e9ad35"/>
        <stop offset="1" stop-color="#9b5b12"/>
      </linearGradient>
      <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#75001f"/>
        <stop offset="1" stop-color="#260014"/>
      </linearGradient>
    </defs>
    <path d="M0 0H165L0 165Z" fill="url(#red)"/>
    <path d="M0 0H225C145 49 70 111 0 246Z" fill="#310018" opacity=".95"/>
    <path d="M0 0H163C99 50 46 104 0 160" fill="none" stroke="#9c092d" stroke-width="2"/>
    <path d="M0 284C75 166 180 69 316 28C392 5 470 0 540 0" fill="none" stroke="url(#gold)" stroke-width="7"/>
    <path d="M0 284C75 166 180 69 316 28C392 5 470 0 540 0" fill="none" stroke="#8d0628" stroke-width="1.5" transform="translate(0,-9)"/>
    <path d="M1672 632V941H1320C1474 893 1594 788 1672 632Z" fill="url(#red)"/>
    <path d="M1672 632C1595 789 1474 892 1320 914C1454 904 1570 856 1672 789Z" fill="#430019" opacity=".9"/>
    <path d="M1672 632C1595 789 1474 892 1320 914" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <path d="M1672 483C1648 635 1567 780 1434 872C1517 838 1608 767 1672 699" fill="none" stroke="#8b0629" stroke-width="2"/>
    <path d="M0 941C102 827 250 746 440 687" fill="none" stroke="#a87935" stroke-opacity=".17" stroke-width="1"/>
    <path d="M0 912C122 811 255 748 405 700" fill="none" stroke="#a87935" stroke-opacity=".12" stroke-width="1"/>
  </svg>

  <section class="center">
    <img class="emblem" src="assets/anniversary-logo.png" alt="50th anniversary emblem">
    <div class="school-name">M.E.S INDIAN SCHOOL</div>
    <div class="motto">LEARN • LEAD • EXCEL</div>
  </section>

  <div class="loading">
    <div class="track"><div class="progress"></div></div>
    <span>Loading...</span>
  </div>
</main>
<div id="Home-Page"></div>
<script src="script.js"></script>
</body>
</html>
